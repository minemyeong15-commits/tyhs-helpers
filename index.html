<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통영고등학교 도우미</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-10">
    <h1 class="text-2xl font-bold mb-5">분실물 등록 테스트</h1>
    <form id="lostForm" class="space-y-4">
        <input type="text" id="itemName" placeholder="물품 이름" required class="block w-full p-2 border">
        <input type="text" id="itemLocation" placeholder="장소" required class="block w-full p-2 border">
        <input type="file" id="itemImage" accept="image/*" required class="block">
        <button type="submit" class="bg-blue-900 text-white px-4 py-2">등록하기</button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhwMYq-_maT30RqGeafPV24IhjcFNXmxA",
            authDomain: "tyhs-project.firebaseapp.com",
            projectId: "tyhs-project",
            storageBucket: "tyhs-project.firebasestorage.app",
            messagingSenderId: "825220196122",
            appId: "1:825220196122:web:4b965a3486c52be411aea3"
        };

        const db = getFirestore(initializeApp(firebaseConfig));

        document.getElementById('lostForm').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('itemName').value;
            const location = document.getElementById('itemLocation').value;
            const file = document.getElementById('itemImage').files[0];
            
            console.log("등록 시도 중...", name, location);

            const reader = new FileReader();
            reader.onload = (event) => {
                addDoc(collection(db, "lostItems"), { 
                    name, location, image: event.target.result, createdAt: Date.now() 
                }).then(() => {
                    console.log("Firestore 저장 성공!");
                    alert("성공적으로 저장되었습니다.");
                }).catch((err) => {
                    console.error("저장 실패:", err);
                    alert("저장 실패: " + err.message);
                });
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
